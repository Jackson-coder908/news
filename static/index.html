<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire — Live News RAG</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #faf9f6;
    --rule: #d8d5cc;
    --accent: #a63d2f;
    --muted: #6b6b63;
    --mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }

  header {
    border-bottom: 3px solid var(--ink);
    padding: 28px 24px 16px;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 2.4rem;
    letter-spacing: 1px;
    font-weight: 900;
  }

  header .tagline {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
  }

  .status-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .status-bar .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3a8a3a;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .ask-box {
    display: flex;
    gap: 0;
    border: 2px solid var(--ink);
  }

  .ask-box input {
    flex: 1;
    border: none;
    padding: 16px 18px;
    font-size: 1rem;
    font-family: Georgia, serif;
    background: white;
  }

  .ask-box input:focus {
    outline: none;
    background: #fffef9;
  }

  .ask-box button {
    border: none;
    border-left: 2px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 16px 28px;
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .ask-box button:hover { background: var(--accent); }
  .ask-box button:disabled { background: var(--muted); cursor: wait; }

  .hint {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  #result {
    margin-top: 40px;
    display: none;
  }

  .answer-block {
    border-left: 4px solid var(--accent);
    padding: 4px 0 4px 20px;
    margin-bottom: 28px;
  }

  .answer-block .label {
    font-family: var(--mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .answer-block p {
    font-size: 1.15rem;
    line-height: 1.65;
    margin: 0;
  }

  .sources .label {
    font-family: var(--mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 12px;
    border-top: 1px solid var(--rule);
    padding-top: 20px;
  }

  .source-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--rule);
  }

  .source-item a {
    color: var(--ink);
    text-decoration: none;
    font-weight: bold;
    font-size: 0.95rem;
  }

  .source-item a:hover { color: var(--accent); }

  .source-meta {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  #loading {
    display: none;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 30px;
    letter-spacing: 1px;
  }

  #loading::after {
    content: '';
    animation: dots 1.4s infinite;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
</style>
</head>
<body>

<header>
  <h1>WIRE</h1>
  <div class="tagline">Live News, Answered by AI</div>
  <div class="status-bar">
    <span><span class="dot"></span><span id="article-count">-- articles indexed</span></span>
  </div>
</header>

<main>
  <div class="ask-box">
    <input type="text" id="question" placeholder="Ask about the latest news..." autofocus />
    <button id="ask-btn" onclick="askQuestion()">Ask</button>
  </div>
  <div class="hint">Try: "what's happening with AI reasoning" or "any chip news"</div>

  <div id="loading">Retrieving and generating</div>

  <div id="result">
    <div class="answer-block">
      <div class="label">Answer</div>
      <p id="answer-text"></p>
    </div>
    <div class="sources">
      <div class="label">Sources Used</div>
      <div id="sources-list"></div>
    </div>
  </div>
</main>

<script>
  const API_BASE = "http://localhost:8000";

  async function loadStatus() {
    try {
      const res = await fetch(`${API_BASE}/status`);
      const data = await res.json();
      document.getElementById("article-count").textContent = `${data.total_articles} articles indexed`;
    } catch (e) {
      document.getElementById("article-count").textContent = "backend offline";
    }
  }

  async function askQuestion() {
    const question = document.getElementById("question").value.trim();
    if (!question) return;

    const btn = document.getElementById("ask-btn");
    btn.disabled = true;
    document.getElementById("loading").style.display = "block";
    document.getElementById("result").style.display = "none";

    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      document.getElementById("answer-text").textContent = data.answer;

      const sourcesList = document.getElementById("sources-list");
      sourcesList.innerHTML = "";
      data.sources.forEach(s => {
        const div = document.createElement("div");
        div.className = "source-item";
        div.innerHTML = `
          <a href="${s.url}" target="_blank">${s.title}</a>
          <div class="source-meta">${s.source} · ${new Date(s.published_at).toLocaleString()}</div>
        `;
        sourcesList.appendChild(div);
      });

      document.getElementById("result").style.display = "block";
    } catch (e) {
      document.getElementById("answer-text").textContent = "Something went wrong — is the backend running?";
      document.getElementById("result").style.display = "block";
    } finally {
      btn.disabled = false;
      document.getElementById("loading").style.display = "none";
    }
  }

  document.getElementById("question").addEventListener("keypress", (e) => {
    if (e.key === "Enter") askQuestion();
  });

  loadStatus();
  setInterval(loadStatus, 30000); // refresh article count every 30s
</script>

</body>
</html>
